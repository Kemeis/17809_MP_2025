<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>17809_Mp_2025 – Panorama</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden; /* brak przewijania */
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .panorama-wrapper {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .panorama-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;      /* wypełnia ekran jak panorama */
      object-position: center; /* centrowanie zdjęcia */
      display: block;
    }
  </style>
</head>
<body>
  <div class="panorama-wrapper">
    <img src="aa.png" alt="Panorama 17809_Mp_2025">
  </div>
</body>
</html>
